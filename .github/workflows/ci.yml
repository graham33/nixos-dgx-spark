name: CI

on:
  push:
    branches: [main]
  pull_request:
    # 'labeled' is not in the default types; without it, adding the
    # full-build label to a PR would not trigger a run.
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      # Building a pull request runs its code -- Nix evaluation on the
      # runner, derivation builders on nixbuild.net -- with
      # NIXBUILD_TOKEN in scope, so only dispatch one after reading the
      # diff. Dispatching requires write access, which is exactly what
      # stops contributors from starting these builds themselves.
      pr:
        description: "PR number to build (blank = the dispatched branch)"
        type: string
        default: ""
      full_build:
        description: "Also build usb-image and the playbook devShells on nixbuild.net"
        type: boolean
        default: false

# Include the event name in the group so pushes to main cannot cancel a
# long-running manually-dispatched full build on the same ref. Dispatched
# PR builds are keyed on the PR number instead: they are all dispatched
# against main, so sharing github.ref would make each one cancel the last.
concurrency:
  group: ci-${{ inputs.pr || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}

      - name: Record the built commit
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
        run: |
          echo "PR #$PR built at $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: DeterminateSystems/flake-checker-action@main

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.flox.dev
            extra-trusted-public-keys = flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs=

      - uses: cachix/cachix-action@v17
        with:
          name: graham33

      - name: Run flake checks (evaluation only)
        run: nix flake check --no-build

      - name: Evaluate the full dgx-spark configuration
        run: nix eval --raw .#nixosConfigurations.dgx-spark.config.system.build.toplevel.drvPath

  # Two kinds of run reach nixbuild-action with an empty
  # secrets.NIXBUILD_TOKEN, which makes it fail within seconds:
  #
  #   * pull requests from forks -- GitHub withholds every secret
  #     (repository, organisation and environment alike) from a
  #     pull_request run whose head is another repository, so no label or
  #     approval gate can hand one back;
  #   * Dependabot-triggered runs -- they read the Dependabot secrets
  #     store rather than the Actions one.
  #
  # Skip rather than report a red build nobody can act on. 'check' still
  # runs on both, and the real build comes either from a maintainer
  # dispatching this workflow with 'pr' set -- that runs in this
  # repository's context, so the token is in scope -- or from the
  # post-merge push to main.
  build:
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}

      - name: Record the built commit
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
        run: |
          echo "PR #$PR built at $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            extra-system-features = kvm nixos-test
            extra-substituters = https://cache.flox.dev
            extra-trusted-public-keys = flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs=

      - uses: nixbuild/nixbuild-action@v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}

      # Pull-only: lets the VM test step below substitute inputs (e.g. the
      # dgx-dashboard package) that nixbuild.net has just auto-pushed.
      - uses: cachix/cachix-action@v17
        with:
          name: graham33

      # Remote-store building: outputs stay on nixbuild.net rather than
      # round-tripping through the runner. The nixbuild.net account is
      # configured (caches = cachix://graham33) to substitute from and
      # auto-push all build results to the cachix cache, so no CI-side
      # cachix push is needed.
      - name: Build packages and checks on nixbuild.net
        run: |
          nix build -L --no-link --keep-going \
            --store ssh-ng://eu.nixbuild.net \
            --eval-store auto \
            --builders "" --max-jobs 2 \
            .#perftest .#openshell .#dgx-dashboard .#cuda-debug \
            .#checks.aarch64-linux.kernel-config-tests \
            .#checks.aarch64-linux.pre-commit-check \
            .#checks.aarch64-linux.vllm-units

      # --builders "" keeps the VM test on the runner (QEMU TCG, no KVM on
      # GitHub ARM runners) rather than dispatching it to nixbuild.net,
      # whose aarch64 KVM support is unconfirmed.
      - name: Run NixOS VM tests (QEMU TCG)
        run: |
          nix build -L --no-link --max-jobs 1 --builders "" \
            .#checks.aarch64-linux.dgx-dashboard-vm

  # Expensive: builds the USB image (including the custom kernel) and the
  # build closure of every playbook devShell (including CUDA torch and
  # vllm) entirely on nixbuild.net. Runs only for PRs labelled
  # 'full-build' or manual dispatch with full_build enabled. Remote-store
  # building keeps the multi-GB closure off the runner; outputs stay on
  # nixbuild.net. The label only reaches this job for same-repository
  # pull requests -- see the note on 'build' for why a labelled fork pull
  # request cannot build; dispatch it with 'pr' and full_build instead.
  full-build:
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && ((github.event_name == 'workflow_dispatch' && inputs.full_build)
      || contains(github.event.pull_request.labels.*.name, 'full-build'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}

      - name: Record the built commit
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
        run: |
          echo "PR #$PR built at $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            extra-system-features = kvm nixos-test
            extra-substituters = https://cache.flox.dev
            extra-trusted-public-keys = flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs=

      - uses: nixbuild/nixbuild-action@v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}

      # Pull-only: lets the boot VM test substitute the kernel and driver
      # closure that nixbuild.net auto-pushed while building usb-image.
      - uses: cachix/cachix-action@v17
        with:
          name: graham33

      - name: Build usb-image on nixbuild.net
        run: |
          nix build -L --no-link \
            --store ssh-ng://eu.nixbuild.net \
            --eval-store auto \
            --builders "" --max-jobs 2 \
            .#usb-image

      # Build the boot test's dependency closure (custom kernel, NVIDIA
      # driver userspace, system toplevel) remotely first, so the local
      # test run below only substitutes -- the runner must never compile
      # the kernel itself.
      - name: Build boot VM test closure on nixbuild.net
        run: |
          nix build -L --no-link \
            --store ssh-ng://eu.nixbuild.net \
            --eval-store auto \
            --builders "" --max-jobs 2 \
            .#checks.aarch64-linux.dgx-spark-boot-vm.driver

      # Boots the template-based system on the custom NVIDIA kernel.
      # --builders "" keeps the test itself on the runner (QEMU TCG).
      - name: Run dgx-spark boot VM test (QEMU TCG)
        run: |
          nix build -L --no-link --max-jobs 1 --builders "" \
            .#checks.aarch64-linux.dgx-spark-boot-vm

      # devshell-closures aggregates every devShell's .inputDerivation
      # (plus a weights-free comfyui), so this proves the playbooks still
      # build rather than merely still evaluate. Runs last and with
      # --keep-going: it is the longest step by far, and one broken
      # playbook should not hide the state of the others.
      - name: Build playbook devShell closures on nixbuild.net
        run: |
          nix build -L --no-link --keep-going \
            --store ssh-ng://eu.nixbuild.net \
            --eval-store auto \
            --builders "" --max-jobs 2 \
            .#devshell-closures
