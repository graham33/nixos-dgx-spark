name: Update flake.lock

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # A PAT rather than the default GITHUB_TOKEN, so the resulting
          # PR triggers the CI workflow (PRs opened with GITHUB_TOKEN
          # deliberately don't trigger workflows).
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/update-flake-lock@main
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          pr-title: "chore: update flake.lock"
          # full-build makes CI also build usb-image (custom kernel) on
          # nixbuild.net -- a nixpkgs bump is the change most likely to
          # break the kernel build, and a green full-build auto-pushes
          # the new kernel to cachix for local machines to substitute.
          pr-labels: |
            dependencies
            full-build
